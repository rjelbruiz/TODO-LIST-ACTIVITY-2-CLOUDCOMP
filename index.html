<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme-Board Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-overlay">
        <div class="login-box" id="login-form">
            <h2>STOP RIGHT THERE!</h2>
            <p>ANOTHER TASK THATS NEEDS TRACKING</p>
            <form onsubmit="handleLogin(event)">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Let Me In!!!</button>
            </form>
            <p class="toggle-text">New here? <span onclick="toggleAuth()">Create an account</span></p>
        </div>

        <div class="login-box hidden" id="signup-form">
            <h2>Join the Chaos</h2>
            <p>Choose your meme identity</p>
            <form onsubmit="handleSignUp(event)">
                <input type="text" placeholder="Username" required>
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="password" id="signupPassword" placeholder="Create Password" required>
                <button type="submit" style="background-color: #39ff14; color: black;">Sign Me Up!</button>
            </form>
            <p class="toggle-text">Already a member? <span onclick="toggleAuth()">Go to Login</span></p>
        </div>
    </div>

    <script>
        function toggleAuth() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('signup-form').classList.toggle('hidden');
        }

        function handleSignUp(event) {
            event.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const pass = document.getElementById('signupPassword').value;
            
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userPass', pass);
            
            alert("ACCOUNT CREATED! Now log in.");
            toggleAuth();
        }

        function handleLogin(event) {
            event.preventDefault();
            const emailInput = document.getElementById('loginEmail').value;
            const passInput = document.getElementById('loginPassword').value;
            
            const savedEmail = localStorage.getItem('userEmail');
            const savedPass = localStorage.getItem('userPass');

            if (emailInput === savedEmail && passInput === savedPass) {
                // Set a temporary session flag
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'todo.html';
            } else {
                alert("WRONG! This account doesn't exist or password is bad. Did you Sign Up?");
            }
        }
    </script>
</body>
</html>
