<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme-Board Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-overlay">
        <div class="login-box">
            <h2>Halt! Who goes there?</h2>
            <p>Log in to enter the meme zone</p>
            <form onsubmit="window.location.href='to do.html'; return false;">
                <input type="email" placeholder="Email (use any)" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Let Me In!!!</button>
            </form>
        </div>
    </div>

</body>
</html>
